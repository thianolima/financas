server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: financas-despesas-processador

  cloud:
    aws:
      region: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_CREDENTIALS_ACCESS_KEY:}
        secret-key: ${AWS_CREDENTIALS_SECRET_KEY:}
      sqs:
        queue:
          comando-nova-despesa: ${AWS_SQS_COMANDO_NOVA_DESPESA:sqs-comando-nova-despesa-dev.fifo}
          retorno-nova-fatura: ${AWS_SQS_RETORNO_NOVA_FATURA:sqs-retorno-nova-fatura-dev}
          comando-processar-regras: ${AWS_SQS_COMANDO_PROCESSAR_REGRAS:sqs-comando-processar-regras-dev.fifo}
          comando-processar-regras-dlq: ${AWS_SQS_COMANDO_PROCESSAR_REGRAS_DLQ:sqs-comando-processar-regras-dev-dlq.fifo}
          comando-nova-notificacao: ${AWS_SQS_COMANDO_NOVA_NOTIFICACAO:sqs-comando-nova-notificacao-dev}

  datasource:
    url: ${AWS_RDS_URL:}
    username: ${AWS_RDS_USER:admin}
    password: ${AWS_RDS_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MySQL8Dialect
        use_sql_comments: true
        format_sql: true

### ACTUATOR / MICROMETER
management:
  endpoints:
    web:
      exposure:
        include: health, beans
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
    propagation:
      type: b3